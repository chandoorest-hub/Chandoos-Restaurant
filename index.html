<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chandoos Restaurant &amp; Bakery — Menu</title>
  <meta name="description" content="Chandoos Restaurant & Bakery digital menu. Catering and party orders undertaken." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1a1a1a;
      --panel: #232323;
      --orange: #f5a11d;
      --orange-dark: #e8890b;
      --text: #f2f2f2;
      --muted: #b9b9b9;
      --line: rgba(255, 255, 255, 0.28);
      --dot: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
      background: var(--bg);
      min-height: 100vh;
    }

    /* ---------- Header / branding ---------- */
    .hero {
      background:
        radial-gradient(circle at 50% 30%, rgba(245,161,29,0.12), transparent 60%),
        #0f0f0f;
      text-align: center;
      padding: 34px 20px 30px;
      border-bottom: 3px solid var(--orange);
    }

    .brand {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      letter-spacing: 4px;
      font-size: 42px;
      color: var(--orange);
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }

    .brand-icons {
      font-size: 26px;
      margin: 6px 0 4px;
      letter-spacing: 8px;
      color: var(--orange);
    }

    .brand-sub {
      font-family: 'Oswald', sans-serif;
      font-style: italic;
      font-size: 22px;
      color: #fff;
      margin-top: 2px;
    }

    .phone {
      display: inline-block;
      background: var(--orange);
      color: #111;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 3px;
      padding: 8px 26px;
      border-radius: 4px;
      margin: 18px 0 10px;
    }

    .catering {
      color: #fff;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ---------- Sticky category nav ---------- */
    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #111;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      padding: 10px 8px;
      scrollbar-width: none;
    }
    .nav::-webkit-scrollbar { display: none; }

    .nav a {
      display: inline-block;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      margin: 0 2px;
      border-radius: 20px;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .nav a:hover, .nav a:active {
      color: #111;
      background: var(--orange);
    }

    /* ---------- Sections ---------- */
    .section { padding: 22px 18px 8px; scroll-margin-top: 60px; }

    .section-title {
      font-family: 'Oswald', sans-serif;
      color: var(--orange);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
      padding-bottom: 8px;
    }

    .section-note {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* Price columns header (for cakes etc.) */
    .cols {
      display: flex;
      justify-content: flex-end;
      gap: 26px;
      color: var(--orange);
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .cols span { width: 56px; text-align: right; }

    /* ---------- Menu item with dotted leader line ---------- */
    ul.items { list-style: none; }

    .item {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .item .name {
      font-size: 15px;
      color: var(--text);
      flex-shrink: 1;
    }
    .item .desc {
      display: block;
      font-size: 12px;
      color: var(--muted);
      font-weight: 300;
    }

    .leader {
      flex: 1;
      border-bottom: 2px dotted var(--line);
      position: relative;
      margin: 0 4px 5px;
      min-width: 14px;
    }
    /* the little white dot before the price, like the design */
    .leader::after {
      content: "";
      position: absolute;
      right: -2px;
      bottom: -5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dot);
    }

    .item .price {
      font-weight: 600;
      font-size: 15px;
      color: #fff;
      white-space: nowrap;
    }

    /* multi-price (columns) */
    .item.multi .price {
      display: flex;
      gap: 26px;
    }
    .item.multi .price span { width: 56px; text-align: right; }

    /* sold out state */
    .item.soldout { opacity: 0.5; }
    .item.soldout .name { text-decoration: line-through; }
    .item.soldout .price { visibility: hidden; }
    .item.soldout .leader::after { background: transparent; }
    .soldout-badge {
      display: inline-block;
      margin-left: 8px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
      background: #c0392b;
      padding: 2px 7px;
      border-radius: 10px;
      vertical-align: middle;
      text-decoration: none;
    }

    .divider-img {
      height: 8px;
      background: var(--orange);
      margin: 4px 0 0;
    }

    footer {
      text-align: center;
      padding: 26px 18px 40px;
      background: #0f0f0f;
      border-top: 3px solid var(--orange);
      margin-top: 20px;
    }
    footer .brand-sm {
      font-family: 'Oswald', sans-serif;
      color: var(--orange);
      font-size: 20px;
      letter-spacing: 3px;
      font-weight: 700;
    }
    footer p { color: var(--muted); font-size: 13px; margin-top: 6px; }
    footer a { color: var(--orange); text-decoration: none; }

    @media (max-width: 400px) {
      .brand { font-size: 34px; }
      .phone { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- ===== HERO ===== -->
    <header class="hero">
      <div class="brand">CHANDOOS</div>
      <div class="brand-icons">🍰 🍴 🍶</div>
      <div class="brand-sub">Restaurant &amp; Bakery</div>
      <a class="phone" href="tel:7777800600">7777 800 600</a>
      <div class="catering">Catering and Party Orders Undertaken</div>
    </header>

    <!-- ===== NAV ===== -->
    <nav class="nav" id="nav"></nav>

    <main id="menu"></main>

    <footer>
      <div class="brand-sm">CHANDOOS</div>
      <p>Restaurant &amp; Bakery</p>
      <p><a href="tel:7777800600">📞 7777 800 600</a> · Catering &amp; party orders undertaken</p>
    </footer>
  </div>

  <!-- Firebase (real-time cross-device sync). Falls back to local cache if not configured. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="menu-data.js"></script>
  <script src="availability.js"></script>
  <script>
    (function () {
      const menuEl = document.getElementById('menu');
      const navEl = document.getElementById('nav');
      let customSig = null;

      function slug(s) {
        return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      }

      function buildMenu() {
        customSig = JSON.stringify(Availability.loadCustom());
        const menu = Availability.getMergedMenu(MENU);

        navEl.innerHTML = '';
        menuEl.innerHTML = '';

        menu.forEach(function (cat) {
          const id = slug(cat.title);

          // nav chip
          const a = document.createElement('a');
          a.href = '#' + id;
          a.textContent = cat.title;
          navEl.appendChild(a);

          // section
          const sec = document.createElement('section');
          sec.className = 'section';
          sec.id = id;

          let html = '<h2 class="section-title">' + cat.title + '</h2>';
          if (cat.note) html += '<p class="section-note">' + cat.note + '</p>';
          if (cat.cols) {
            html += '<div class="cols">';
            cat.cols.forEach(function (c) { html += '<span>' + c + '</span>'; });
            html += '</div>';
          }

          html += '<ul class="items">';
          cat.items.forEach(function (it) {
            const multi = Array.isArray(it.price);
            const itemId = Availability.itemId(cat.title, it.name);
            const available = Availability.isAvailable(itemId);
            html += '<li class="item' + (multi ? ' multi' : '') + (available ? '' : ' soldout') + '" data-id="' + itemId + '">';
            html += '<span class="name"><span class="name-text">' + it.name + '</span>' +
                    '<span class="soldout-badge"' + (available ? ' style="display:none"' : '') + '>Sold Out</span>' +
                    (it.desc ? '<span class="desc">' + it.desc + '</span>' : '') +
                    '</span>';
            html += '<span class="leader"></span>';
            if (multi) {
              html += '<span class="price">';
              it.price.forEach(function (p) { html += '<span>' + p + '</span>'; });
              html += '</span>';
            } else {
              html += '<span class="price">' + it.price + '</span>';
            }
            html += '</li>';
          });
          html += '</ul>';

          sec.innerHTML = html;
          menuEl.appendChild(sec);
        });
      }

      // Light update: just toggle sold-out state on existing rows.
      function applyAvailability() {
        menuEl.querySelectorAll('.item[data-id]').forEach(function (li) {
          const available = Availability.isAvailable(li.dataset.id);
          li.classList.toggle('soldout', !available);
          const badge = li.querySelector('.soldout-badge');
          if (badge) badge.style.display = available ? 'none' : '';
        });
      }

      // Called on first load AND on every remote change (via Firebase listener).
      function sync() {
        const sig = JSON.stringify(Availability.loadCustom());
        if (sig !== customSig) buildMenu();   // items added/removed -> full rebuild
        else applyAvailability();             // only sold-out state changed
      }

      // Subscribe to shared state. sync() runs on load and on every device update.
      Availability.init(sync);
    })();
  </script>
</body>
</html>
